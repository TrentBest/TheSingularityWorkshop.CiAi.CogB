name: CogB Contract Verification
on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore tests/TheSingularityWorkshop.CiAi.CogB.ContractTests/TheSingularityWorkshop.CiAi.CogB.ContractTests.csproj
      - run: dotnet build tests/TheSingularityWorkshop.CiAi.CogB.ContractTests/TheSingularityWorkshop.CiAi.CogB.ContractTests.csproj --configuration Release --no-restore
      - run: dotnet run --project tests/TheSingularityWorkshop.CiAi.CogB.ContractTests --configuration Release --no-build